name: Repair ICE-800 Security Phase 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Phase 2 safely
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/ice800_phase2.py
          python /tmp/ice800_phase2.py

      - name: Validate Phase 2
        shell: bash
        run: |
          python -m py_compile backend/main.py backend/clerk_auth.py
          grep -q "def strict_mfa_context" backend/clerk_auth.py
          grep -q "def revoke_other_clerk_sessions" backend/clerk_auth.py
          grep -q '"/api/security/sessions/revoke-others"' backend/main.py
          grep -q 'id="revokeOtherSessions"' backend/static/index.html
          grep -q "revokeOtherSessions').onclick" backend/static/app.js
          grep -q "first_age > 5 or second_age > 5" backend/clerk_auth.py
          echo "ICE-800 Security Phase 2 validation passed."

      - name: Remove broken workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/harden-ice800-security-phase2.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Repair ICE-800 Security Phase 2"
            git push
          fi
