name: Build ICE-800 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct ICE-800 Android project
        shell: bash
        run: |
          cat > ice800_project.b64 <<'ICE800EOF'

ICE800EOF
          base64 -d ice800_project.b64 > ice800_project.tar.gz
          mkdir -p generated
          tar -xzf ice800_project.tar.gz -C generated

      - name: Build installable APK
        working-directory: generated
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-800-Android
          path: generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
