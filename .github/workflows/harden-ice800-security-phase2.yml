name: Harden ICE-800 Security Phase 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Clerk session revocation helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/clerk_auth.py")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "first_age > 10 or second_age > 10",
              "first_age > 5 or second_age > 5",
          )

          marker = "\ndef public_config() -> dict[str, Any]:\n"
          if "def strict_mfa_context(" not in s:
              block = '''
def strict_mfa_context(authorization: str | None = Header(None)) -> dict[str, Any]:
    if not authorization or not authorization.startswith("Bearer "):
        raise HTTPException(401, "Missing Clerk bearer token")

    claims = _verify_token(authorization.split(" ", 1)[1])
    fva = claims.get("fva")
    if not isinstance(fva, (list, tuple)) or len(fva) < 2:
        raise HTTPException(
            403,
            "Recent multi-factor verification is required for this sensitive action.",
        )

    try:
        first_age = int(fva[0])
        second_age = int(fva[1])
    except (TypeError, ValueError):
        raise HTTPException(
            403,
            "Recent multi-factor verification is required for this sensitive action.",
        )

    if first_age < 0 or second_age < 0 or first_age > 5 or second_age > 5:
        raise HTTPException(
            403,
            "Security check required: sign out and sign in again with MFA before this sensitive action.",
        )

    session_id = str(claims.get("sid") or "").strip()
    clerk_user_id = str(claims.get("sub") or "").strip()
    if not session_id or not clerk_user_id:
        raise HTTPException(401, "Clerk session context is incomplete")

    return {
        "user_id": _resolve_local_user(clerk_user_id),
        "clerk_user_id": clerk_user_id,
        "session_id": session_id,
    }


def revoke_other_clerk_sessions(clerk_user_id: str, current_session_id: str) -> int:
    secret = os.getenv("CLERK_SECRET_KEY", "").strip()
    if not secret:
        raise HTTPException(503, "Clerk backend authentication is not configured")

    headers = {
        "Authorization": f"Bearer {secret}",
        "Accept": "application/json",
        "Content-Type": "application/json",
    }

    try:
        with httpx.Client(timeout=15.0) as client:
            response = client.get(
                "https://api.clerk.com/v1/sessions",
                params={
                    "user_id": clerk_user_id,
                    "status": "active",
                    "limit": 100,
                },
                headers=headers,
            )
            response.raise_for_status()
            payload = response.json()

            if isinstance(payload, list):
                sessions = payload
            elif isinstance(payload, dict):
                sessions = payload.get("data") or []
            else:
                sessions = []

            revoked = 0
            for session in sessions:
                session_id = str((session or {}).get("id") or "").strip()
                if not session_id or session_id == current_session_id:
                    continue

                revoke = client.post(
                    f"https://api.clerk.com/v1/sessions/{session_id}/revoke",
                    headers=headers,
                )
                revoke.raise_for_status()
                revoked += 1

            return revoked
    except httpx.HTTPStatusError as exc:
        raise HTTPException(
            502,
            "Clerk rejected the session revocation request.",
        ) from exc
    except httpx.HTTPError as exc:
        raise HTTPException(
            503,
            "Unable to reach Clerk to revoke other sessions.",
        ) from exc
'''
              if marker not in s:
                  raise SystemExit("public_config marker not found in clerk_auth.py")
              s = s.replace(marker, "\n" + block + marker, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Add protected security endpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/main.py")
          s = p.read_text(encoding="utf-8")

          old_import = (
              "from clerk_auth import current_user as clerk_current_user, "
              "strict_mfa_user, public_config"
          )
          new_import = (
              "from clerk_auth import current_user as clerk_current_user, "
              "strict_mfa_user, strict_mfa_context, "
              "revoke_other_clerk_sessions, public_config"
          )

          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit("Expected clerk_auth import not found in main.py")

          anchor = '@app.get("/api/public-config")\n'
          if '@app.post("/api/security/sessions/revoke-others")' not in s:
              block = '''@app.post("/api/security/sessions/revoke-others")
async def revoke_other_sessions(context: dict = Depends(strict_mfa_context)):
    revoked = revoke_other_clerk_sessions(
        context["clerk_user_id"],
        context["session_id"],
    )
    audit_event(
        context["user_id"],
        "security.other_sessions_revoked",
        {"revoked_count": revoked},
    )
    return {"ok": True, "revoked": revoked}


'''
              if anchor not in s:
                  raise SystemExit("public-config route anchor not found in main.py")
              s = s.replace(anchor, block + anchor, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Add session recovery control to Settings UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/static/index.html")
          s = p.read_text(encoding="utf-8")

          old = '<button id="logout" class="danger" data-i18n="logout">Cerrar sesión</button>'
          new = '<p class="muted" data-i18n="sessionRecoveryHelp">Si pierdes un teléfono o detectas un acceso extraño, cierra todas las demás sesiones desde este dispositivo verificado.</p><div class="row"><button id="revokeOtherSessions" class="danger" data-i18n="revokeOtherSessions">Cerrar otras sesiones</button><button id="logout" class="danger" data-i18n="logout">Cerrar sesión</button></div>'

          if old in s:
              s = s.replace(old, new, 1)
          elif 'id="revokeOtherSessions"' not in s:
              raise SystemExit("Logout button anchor not found in index.html")

          s = s.replace(
              '<script src="/static/app.js"></script>',
              '<script src="/static/app.js?v=security-phase2"></script>',
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Add frontend behavior and translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/static/app.js")
          s = p.read_text(encoding="utf-8")

          es_old = "securityText:'Los tokens de proveedores se guardan en el backend. Los pagos requieren confirmación explícita. Las solicitudes de crédito se completan en el flujo autorizado del proveedor/emisor.',logout:'Cerrar sesión'"
          es_new = "securityText:'Los tokens de proveedores se guardan en el backend. Los pagos requieren confirmación explícita. Las solicitudes de crédito se completan en el flujo autorizado del proveedor/emisor.',sessionRecoveryHelp:'Si pierdes un teléfono o detectas un acceso extraño, cierra todas las demás sesiones desde este dispositivo verificado.',revokeOtherSessions:'Cerrar otras sesiones',logout:'Cerrar sesión'"

          en_old = "securityText:'Provider tokens are stored on the backend. Payments require explicit confirmation. Credit applications are completed in the authorized provider/issuer flow.',logout:'Sign out'"
          en_new = "securityText:'Provider tokens are stored on the backend. Payments require explicit confirmation. Credit applications are completed in the authorized provider/issuer flow.',sessionRecoveryHelp:'If you lose a phone or detect suspicious access, close every other session from this verified device.',revokeOtherSessions:'Close other sessions',logout:'Sign out'"

          if es_old in s:
              s = s.replace(es_old, es_new, 1)
          if en_old in s:
              s = s.replace(en_old, en_new, 1)

          logout_line = "$('#logout').onclick=async()=>{if(clerk)await clerk.signOut({redirectUrl:'/'});else location.reload()};"
          if "$('#revokeOtherSessions').onclick" not in s:
              handler = '''$('#revokeOtherSessions').onclick=async()=>{
  const message=lang==='es'
    ?'¿Cerrar todas las demás sesiones de ICE-800? Usa esto si perdiste un dispositivo o detectas un acceso sospechoso.'
    :'Close every other ICE-800 session? Use this if you lost a device or detect suspicious access.';
  if(!confirm(message))return;
  try{
    const result=await api('/api/security/sessions/revoke-others',{method:'POST'});
    toast(lang==='es'
      ?(`Sesiones cerradas: ${result.revoked}`)
      :(`Sessions closed: ${result.revoked}`));
  }catch(e){
    toast(e.message);
  }
};
'''
              if logout_line not in s:
                  raise SystemExit("Logout handler anchor not found in app.js")
              s = s.replace(logout_line, handler + logout_line, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate Phase 2 hardening
        shell: bash
        run: |
          python -m py_compile backend/main.py backend/clerk_auth.py
          grep -q "def strict_mfa_context" backend/clerk_auth.py
          grep -q "def revoke_other_clerk_sessions" backend/clerk_auth.py
          grep -q '"/api/security/sessions/revoke-others"' backend/main.py
          grep -q 'id="revokeOtherSessions"' backend/static/index.html
          grep -q "revokeOtherSessions').onclick" backend/static/app.js
          grep -q "first_age > 5 or second_age > 5" backend/clerk_auth.py
          echo "ICE-800 Security Phase 2 validation passed."

      - name: Commit Phase 2 hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/clerk_auth.py backend/main.py backend/static/index.html backend/static/app.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add ICE-800 session recovery and remote revocation"
            git push
          fi
