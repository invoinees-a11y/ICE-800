name: Extract ICE-800 Pilot Backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract backend package
        shell: bash
        run: |
          set -e
          rm -rf backend
          rm -rf /tmp/ice800
          mkdir -p backend /tmp/ice800
          unzip -q "ICE-800-Pilot-Live-Backend.zip" -d /tmp/ice800
          cp -a /tmp/ice800/ICE-800_Pilot_Live_Backend/. backend/
          find backend -type d -name "__pycache__" -prune -exec rm -rf {} +
          find backend -type f -name "*.pyc" -delete
          echo "Backend files:"
          find backend -maxdepth 2 -type f | sort | head -100

      - name: Commit extracted backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No backend changes to commit."
          else
            git commit -m "Extract ICE-800 Pilot Live backend"
            git push
          fi
