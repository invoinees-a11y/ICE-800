      - name: Validate patched backend and frontend
        shell: bash
        run: |
          python -m py_compile backend/main.py backend/production_api.py backend/clerk_auth.py backend/config.py
          node --check backend/static/app.js
          grep -q "CLERK_PUBLISHABLE_KEY" backend/config.py
          grep -q "ICE Secure Access" backend/static/index.html
          grep -q "Legacy ICE-800 authentication is disabled" backend/main.py
          echo "Validation passed."

      - name: Commit security upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace legacy auth with Clerk Secure Access"
            git push
          fi
